name: Windows contribution checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check editor and preview
        run: |
          node --check frontend/app-v2.js
          node --check frontend/i18n.js
          node scripts/test-editor.cjs
          node scripts/test-preview.cjs
      - name: Build release
        run: cargo build --release --locked
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/TelemetryForge.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TelemetryForge.exe" | Set-Content target/release/TelemetryForge.exe.sha256
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: TelemetryForge-windows-x64-network-auto
          if-no-files-found: error
          path: |
            target/release/TelemetryForge.exe
            target/release/TelemetryForge.exe.sha256
